<title>Eschborn-Frankfurt 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Kopfzeile mit Countdown, Wochenleiste, Wochenplan mit Download-Spalte, darunter Garmin-Auswertung. Farben aus den Leistungszonen, Schrift aus der Rennbeschilderung. */
:root{
  --bg:#dfe8ef; --panel:#f7fafc; --panel2:#e9eff4; --ink:#22303a; --muted:#6b7c88; --line:#dce5ec;
  --accent:#f0645a; --accent-ink:#ffffff; --accent-soft:#fde3df;
  --ok:#3a8f6e; --bad:#d9483c;
  --z1:#8ea4b0; --z2:#3d9a77; --z3:#cfa51a; --z4:#e5862a; --z5:#d6452d; --z6:#98409f;
  --s-rad:#f0645a; --s-schwimmen:#4a98c9; --s-kraft:#7a6bb8; --s-lauf:#e08a3a; --s-sonst:#7b8a94;
  --k-deload:#dcefe6; --k-test:#fbeccb; --k-taper:#e6e2f4;
  --c1:#4a7fa8; --c2:#f0645a;
  --hero1:#93a7b7; --hero2:#71889a; --shadow:0 2px 6px rgba(34,48,58,.05),0 12px 28px rgba(34,48,58,.07);
  --nav:#22303a; --nav-ink:#ffffff; --soft:#e7edf2;
  --t-hard:#fde3df; --t-hard-ink:#b8392f; --t-easy:#dcefe6; --t-easy-ink:#2b7556; --t-long:#dde9f3; --t-long-ink:#2f628a; --t-test:#fbeccb; --t-test-ink:#8a6200;
  --font-d:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-b:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a20; --panel:#1b252d; --panel2:#222e37; --ink:#e9eff3; --muted:#9aabb6; --line:#2a3741;
    --accent:#ff7a6f; --accent-ink:#2a0f0c; --accent-soft:#4a2421;
    --ok:#5cc196; --bad:#ff7d70;
    --z1:#7f98a6; --z2:#4fb88f; --z3:#e0bc3c; --z4:#f09c45; --z5:#ef6a52; --z6:#c071cc;
    --s-rad:#ff7a6f; --s-schwimmen:#6db4e0; --s-kraft:#a596e0; --s-lauf:#f0a050; --s-sonst:#8b9ba6;
    --k-deload:#173528; --k-test:#3b3216; --k-taper:#2a2550;
    --c1:#79aed6; --c2:#ff7a6f;
    --hero1:#3d505e; --hero2:#2c3c48; --shadow:0 1px 2px rgba(0,0,0,.3);
    --nav:#e9eff3; --nav-ink:#121a20; --soft:#26323b;
    --t-hard:#4a2421; --t-hard-ink:#ffb2a9; --t-easy:#173528; --t-easy-ink:#8fe0b5; --t-long:#1d3346; --t-long-ink:#a9cdee; --t-test:#3b3216; --t-test-ink:#f3d27a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#121a20; --panel:#1b252d; --panel2:#222e37; --ink:#e9eff3; --muted:#9aabb6; --line:#2a3741;
    --accent:#ff7a6f; --accent-ink:#2a0f0c; --accent-soft:#4a2421;
    --ok:#5cc196; --bad:#ff7d70;
    --z1:#7f98a6; --z2:#4fb88f; --z3:#e0bc3c; --z4:#f09c45; --z5:#ef6a52; --z6:#c071cc;
    --s-rad:#ff7a6f; --s-schwimmen:#6db4e0; --s-kraft:#a596e0; --s-lauf:#f0a050; --s-sonst:#8b9ba6;
    --k-deload:#173528; --k-test:#3b3216; --k-taper:#2a2550;
    --c1:#79aed6; --c2:#ff7a6f;
    --hero1:#3d505e; --hero2:#2c3c48; --shadow:0 1px 2px rgba(0,0,0,.3);
    --nav:#e9eff3; --nav-ink:#121a20; --soft:#26323b;
    --t-hard:#4a2421; --t-hard-ink:#ffb2a9; --t-easy:#173528; --t-easy-ink:#8fe0b5; --t-long:#1d3346; --t-long-ink:#a9cdee; --t-test:#3b3216; --t-test-ink:#f3d27a;
    color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-d);margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:24px;line-height:1.15}
h3{font-size:17px;line-height:1.2}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopfzeile */
.hero{display:flex;flex-wrap:wrap;gap:18px 36px;align-items:flex-end;justify-content:space-between;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:28px;padding:26px 28px;box-shadow:var(--shadow)}
.hero .eyebrow,.hero .sub,.hero .count .l,.hero .ftp label,.hero .ftp small,.hero .ftp .u{color:rgba(255,255,255,.86)}
.hero .sub{border-top:0;padding-top:0}
.hero .ftp input{background:rgba(255,255,255,.18);border-color:transparent;border-radius:16px;color:#fff}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.hero h1{font-size:clamp(32px,6vw,50px);line-height:1;font-weight:700;letter-spacing:-.025em;margin-top:6px}
.hero .sub{color:rgba(255,255,255,.86);margin-top:8px}
.hero-r{display:flex;flex-wrap:wrap;gap:14px 30px;align-items:flex-end}
.count .n{font-family:var(--font-d);font-weight:700;font-size:60px;line-height:.9;font-variant-numeric:tabular-nums}
.count .l{font-size:13px;color:var(--muted);margin-top:4px}
.ftp{display:flex;flex-direction:column;gap:4px}
.ftp label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ftp .row{display:flex;align-items:baseline;gap:6px}
.ftp input{width:116px;font-family:var(--font-d);font-weight:700;font-size:32px;line-height:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 8px;font-variant-numeric:tabular-nums}
.ftp .u{font-family:var(--font-d);font-size:22px;color:var(--muted)}
.ftp small{color:var(--muted);font-size:12px}

/* Karten */
.card{background:var(--panel);border:0;border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;line-height:1.1;text-align:center;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--soft);border-color:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 14px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:0;background:var(--soft);border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.sw{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none;display:inline-block}

/* Wochenleiste */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.groups{display:flex;flex-wrap:wrap;gap:14px 22px}
.grp-h{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.wk{position:relative;min-width:40px;height:42px;border:0;background:var(--soft);border-radius:999px;font-family:var(--font-d);font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.wk.k-deload{background:var(--k-deload)} .wk.k-test{background:var(--k-test)} .wk.k-taper{background:var(--k-taper)}
.wk.sel{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgba(240,100,90,.35)}
.wk.cur::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:var(--ink)}
.wk.has::before{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* Woche */
.main-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.wk-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.wk-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.nav{display:flex;gap:6px}
.nav .btn{padding:6px 11px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--muted);margin-bottom:6px}
.bar{flex:1 1 120px;height:8px;border-radius:999px;background:var(--soft);overflow:hidden;max-width:220px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.day{display:grid;grid-template-columns:70px minmax(0,1fr) 150px;gap:4px 14px;padding:12px 8px;border-top:1px solid var(--line);transition:background .2s}
.day.done{background:var(--panel2);border-radius:18px;border-top-color:transparent}
.day.done > div:nth-child(2) > :not(.sub),.sub.done{opacity:.55}
.day.done > div > .t .ttl,.sub.done .t .ttl{text-decoration:line-through;text-decoration-thickness:1px}
.dchk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:transparent;transition:background .15s,border-color .15s}
.dchk:hover{border-color:var(--ok)}
.dchk svg{width:15px;height:15px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dchk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.dchk[disabled]{cursor:default}
.chip.t-hard{background:var(--t-hard);color:var(--t-hard-ink);border-color:transparent}
.chip.t-easy{background:var(--t-easy);color:var(--t-easy-ink);border-color:transparent}
.chip.t-long{background:var(--t-long);color:var(--t-long-ink);border-color:transparent}
.chip.t-test{background:var(--t-test);color:var(--t-test-ink);border-color:transparent}
.day.today{background:var(--accent-soft);border-radius:18px;border-top-color:transparent}
.day .d{font-family:var(--font-d);font-weight:600;font-size:24px;line-height:1}
.day .d small{display:block;font-family:var(--font-b);font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
.day .t{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.day .x{color:var(--muted);font-size:14px;margin-top:3px}
.day .x b{color:var(--ink);font-weight:600}
.day .w{margin-top:5px;font-size:13px;color:var(--accent);font-weight:500}
.st{font-size:13px;text-align:right;color:var(--muted)}
.st.ok{color:var(--ok);font-weight:600}
.st.miss{color:var(--bad)}
.st small{display:block;color:var(--muted);font-weight:400}
.st .btn{margin-top:6px}
.chip.opt{border-style:dashed}
.sub{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.sub .btn{margin-top:6px}

/* Fortschritt */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:0;border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-b);font-weight:600;font-size:30px;line-height:1.1}
.tile .s{font-size:13px;color:var(--muted)}
.tile .btn{margin-top:6px;align-self:flex-start}
.insights{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.lkey{display:inline-block;width:16px;height:2px;border-radius:1px;background:var(--c);vertical-align:middle}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);vertical-align:middle}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
details.tv summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;margin-top:10px}
#progress{display:flex;flex-direction:column;gap:18px}
#progress .chartwrap svg{min-width:0}

/* Download-Spalte */
.side{display:flex;flex-direction:column;gap:18px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.wo{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.wo-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wo-h b{font-weight:600}
.wo svg{display:block;width:100%;height:56px;margin:8px 0;border-bottom:1px solid var(--line)}
.wo-m{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);align-items:center;justify-content:space-between}
.wo-m + .wo-m{margin-top:8px}
.zrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.zrow:first-of-type{border-top:0}
.zrow .p{color:var(--muted);font-size:12px}
.zrow .wt{font-family:var(--font-d);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}

/* Garmin */
.g-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px}
.drop{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);border-radius:20px;padding:22px 14px;cursor:pointer;background:var(--panel2)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.sr:focus-visible + .drop{outline:2px solid var(--accent);outline-offset:2px}
.drop b{font-family:var(--font-d);font-size:20px;font-weight:600}
.howto{font-size:13px;color:var(--muted);margin-top:12px;display:flex;flex-direction:column;gap:4px}
.log{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.log li{display:flex;gap:8px;align-items:baseline}
.log .ok{color:var(--ok)} .log .bad{color:var(--bad)}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:560px;height:auto}
.ax{fill:var(--muted);font-size:10px;font-family:var(--font-b)}
.ax.b{font-weight:700;fill:var(--ink)}
.grid{stroke:var(--line);stroke-width:1}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-d);font-size:20px;font-weight:600;margin-bottom:4px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
tr.selrow td{background:var(--accent-soft)}
.rowbtn{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink)}
.rowbtn:hover{color:var(--accent)}
.x-btn{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.x-btn:hover{color:var(--bad)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px 16px;margin:4px 0 14px}
.m b{display:block;font-family:var(--font-d);font-weight:600;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.m span{font-size:12px;color:var(--muted)}
.readout{min-height:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:5}

.fld{background:var(--panel2);color:var(--ink);border:1px solid transparent;border-radius:12px;padding:7px 10px;min-width:0;width:100%}
.fld:focus{border-color:var(--accent);background:var(--panel)}
.s-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.s-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:6px}
.s-h h3{display:inline}
.s-h .muted{margin-left:8px;font-size:13px}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.ex{padding:11px 0;border-top:1px solid var(--line)}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-h b{font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.sets input{width:66px;text-align:right;font-variant-numeric:tabular-nums}
.sets .u{font-size:13px;color:var(--muted)}
.sets2{display:grid;grid-template-columns:44px repeat(var(--n),minmax(0,1fr));gap:6px;align-items:center;margin-top:7px;max-width:420px}
.sets2 .sl{font-size:12px;color:var(--muted);font-weight:600}
.sets2 .sh{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.04em}
.sets2 input{width:100%;text-align:center;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.exchk{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.exchk input{width:20px;height:20px;accent-color:var(--ok);margin:0;flex:none;cursor:pointer}
.ex{transition:background .2s}
.ex.done{background:var(--soft);border-radius:16px;border-top-color:transparent;margin-inline:-8px;padding-inline:8px}
.ex.done + .ex{border-top-color:transparent;margin-top:8px}
.ex + .ex.done{margin-top:8px}
.ex.done .ex-h b{color:var(--muted)}
.ex.done .sets,.ex.done .sets2,.ex.done .hint{opacity:.55}
.card.sdone .ex:not(.done){opacity:.6}
.card.sdone{background:var(--panel2)}

.ord{display:flex;flex-direction:column}
.ord .x-btn{padding:0 6px;font-size:14px}
.ord .x-btn[disabled]{opacity:.25;cursor:default}
.erow{display:grid;grid-template-columns:28px minmax(0,1fr) 62px minmax(0,96px) 28px;gap:6px;align-items:center;padding:5px 0}
.erow.h{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding-bottom:2px}
.adapt{margin-top:8px;font-size:13px;color:var(--ink);background:var(--accent-soft);border-radius:14px;padding:9px 12px}
.adapt small{display:block;color:var(--muted);margin-top:2px}
.adapt.warn{background:var(--k-test)}
.day.cont{border-top:1px dashed var(--line)}
.chip.mvd{border-color:var(--accent);color:var(--accent)}
.mv{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.mv select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.ana{margin-top:8px;font-size:13px;border-left:3px solid var(--line);padding:4px 0 4px 10px}
.ana.ok{border-color:var(--ok)}.ana.warn{border-color:var(--k-test)}.ana.hard{border-color:var(--accent)}
.ana summary{cursor:pointer;line-height:1.4}
.ana ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.ana li{margin:2px 0}
.banner{font-size:14px;color:var(--ink);background:var(--panel);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}
@media (max-width:900px){
  .main-grid,.g-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .day{grid-template-columns:54px minmax(0,1fr)}
  .day .st{grid-column:2;text-align:left}
  .mv{justify-content:flex-start}
  .mv select{font-size:16px;min-height:40px}
  .count .n{font-size:48px}
}

#strength{display:flex;flex-direction:column;gap:14px}

<script>
'use strict';
const DATA = __DATA__;

/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);

}

}

  if (a.getMonth() === b.getMonth()) return a.getDate() + '.–' + b.getDate() + '. ' + MON[b.getMonth()];
  return a.getDate() + '. ' + MONS[a.getMonth()] + ' – ' + b.getDate() + '. ' + MONS[b.getMonth()];

const num = (v, d = 0) => (v == null || isNaN(v)) ? '–' : Number(v).toFixed(d).replace('.', ',');

/* ---------- Plan ---------- */
const W = DATA.weeks.map(w => Object.assign({}, w, { startD: parseISO(w.start) }));
const W0 = W[0].startD;
const RACE = parseISO(DATA.race);
const TODAY = midnight(new Date());
const weekIdxOfDate = d => Math.floor(daysBetween(W0, d) / 7);
const curWeek = Math.min(Math.max(weekIdxOfDate(TODAY), 0), W.length - 1);
const KIND = {normal:'Belastungswoche', deload:'Entlastungswoche', test:'FTP-Test-Woche', taper:'Taper-Woche'};
const ZONES = [
  {k:'Z2', n:'Grundlage', lo:.56, hi:.75, c:'--z2'},
  {k:'Z3', n:'Tempo', lo:.76, hi:.87, c:'--z3'},
  {k:'Z4', n:'Sweet Spot', lo:.88, hi:.94, c:'--z4'},
  {k:'Z5', n:'Schwelle', lo:.95, hi:1.05, c:'--z5'},
  {k:'Z6', n:'VO2max', lo:1.06, hi:1.20, c:'--z6'}
];
const zoneVar = f => f < .56 ? '--z1' : f < .76 ? '--z2' : f < .88 ? '--z3' : f < .95 ? '--z4' : f < 1.06 ? '--z5' : '--z6';

/* ---------- Zustand ---------- */
let sel = curWeek;
let selAct = null;
let DL;            // undefined = wird geladen, null = nicht verfügbar
let busy = false;
let lastImport = [];
const Store = { acts: [], ftp: DATA.ftp, mode: 'pending', db: null, splan: null, slogs: {}, dlogs: {}, moves: {}, pushes: {}, sloaded: false };

/* ---------- Speicher: Dashboard-Datenbank, sonst Browser, sonst Sitzung ---------- */
function localLoad() {
  try {
    const raw = localStorage.getItem('ef27.acts');
    if (raw) Store.acts = JSON.parse(raw) || [];
    const f = Number(localStorage.getItem('ef27.ftp'));
    if (f > 0) Store.ftp = f;
    const sp = localStorage.getItem('ef27.splan');
    if (sp) Store.splan = JSON.parse(sp);
    const sl = localStorage.getItem('ef27.slogs');
    if (sl) Store.slogs = JSON.parse(sl) || {};
    const dl = localStorage.getItem('ef27.dlogs');
    if (dl) Store.dlogs = JSON.parse(dl) || {};
    const mv = localStorage.getItem('ef27.moves');
    if (mv) Store.moves = JSON.parse(mv) || {};

  } catch (e) { Store.mode = 'memory'; }

}
function localSave() {
  try {
    localStorage.setItem('ef27.acts', JSON.stringify(Store.acts));
    localStorage.setItem('ef27.ftp', String(Store.ftp));
    localStorage.setItem('ef27.splan', JSON.stringify(Store.splan));
    localStorage.setItem('ef27.slogs', JSON.stringify(Store.slogs));
    localStorage.setItem('ef27.dlogs', JSON.stringify(Store.dlogs));
    localStorage.setItem('ef27.moves', JSON.stringify(Store.moves));
  } catch (e) { Store.mode = 'memory'; }
}
async function initStore() {

  const fail = () => { Store.db = null; localLoad(); render(); };
  try {
    db.collection('activities').onSnapshot(snap => {
      Store.acts = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      render();
    }, fail);
    db.doc('settings/main').onSnapshot(s => {
      if (s.exists) { const f = Number((s.data() || {}).ftp); if (f > 0) Store.ftp = f; }
      render();
    }, () => {});
    db.doc('strength/plan').onSnapshot(sn => {
      Store.splan = sn.exists ? JSON.parse(JSON.stringify(sn.data())) : null;
      Store.sloaded = true;
      renderStrengthSafe(); renderWeek();
    }, () => { Store.sloaded = true; renderStrengthSafe(); });
    db.collection('strengthlogs').onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = JSON.parse(JSON.stringify(d.data())); });
      Store.slogs = m;
      renderStrengthSafe(); renderWeek(); renderProgress();
    }, () => {});
    db.collection('daylogs').onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = JSON.parse(JSON.stringify(d.data())); });
      Store.dlogs = m;
      renderWeek(); renderStrip(); renderProgress();
    }, () => {});
    db.collection('moves').onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = JSON.parse(JSON.stringify(d.data())); });
      Store.moves = m;
      renderWeek(); renderStrengthSafe(); renderProgress();
    }, () => {});
    db.collection('pushes').onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { m[d.id] = JSON.parse(JSON.stringify(d.data())); });

    }, () => {});
  } catch (e) { fail(); }
}
async function storeAdd(list) {
  for (const a of list) {
    if (Store.db) { await Store.db.collection('activities').doc(a.id).set(a); }
    else {
      const i = Store.acts.findIndex(x => x.id === a.id);
      if (i >= 0) Store.acts[i] = a; else Store.acts.push(a);
    }
  }
  if (!Store.db) localSave();
}
async function storeRemove(id) {
  if (Store.db) await Store.db.collection('activities').doc(id).delete();
  else { Store.acts = Store.acts.filter(a => a.id !== id); localSave(); }
}
async function storeFtp(v) {
  Store.ftp = v;
  if (Store.db) { try { await Store.db.doc('settings/main').set({ ftp: v }); } catch (e) { toast('FTP konnte nicht gespeichert werden.'); } }

}
function toast(t) {
  const el = $('#msg'); el.textContent = t; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4200);
}

/* ---------- Auswertung ---------- */
const sorted = () => Store.acts.slice().sort((a, b) => b.start - a.start);
function tssOf(a) {
  const p = a.np || a.avgP;
  if (a.sport !== 'rad' || !p || !a.dur) return null;
  const f = p / Store.ftp;
  return a.dur / 3600 * f * f * 100;
}
const actWeek = a => weekIdxOfDate(new Date(a.start * 1000));
function actsOfWeek(i) { return Store.acts.filter(a => actWeek(a) === i); }

/* ---------- Workout-Dateien ---------- */
function zwoSteps(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const w = doc.getElementsByTagName('workout')[0];
  if (!w) return [];
  return Array.from(w.children).map(e => {
    const t = e.tagName, dur = Number(e.getAttribute('Duration'));
    if (t === 'Warmup' || t === 'Cooldown' || t === 'Ramp') return {dur, a:Number(e.getAttribute('PowerLow')), b:Number(e.getAttribute('PowerHigh')), kind:'ramp'};
    if (t === 'FreeRide') return {dur, a:1, b:1, kind:'free'};
    const p = Number(e.getAttribute('Power')); return {dur, a:p, b:p, kind:'steady'};
  });
}
function workoutInfo(file) {
  const steps = zwoSteps(woXml(file));
  const total = steps.reduce((s, x) => s + x.dur, 0);
  let s4 = 0;
  steps.forEach(x => { const p = (x.a + x.b) / 2; s4 += x.dur * Math.pow(p, 4); });
  const IF = total ? Math.pow(s4 / total, .25) : 0;
  return { steps, total, tss: total / 3600 * IF * IF * 100 };
}
function profileSvg(steps) {
  const total = steps.reduce((s, x) => s + x.dur, 0) || 1, VW = 600, VH = 56, YM = 1.3;
  let x = 0, out = '';
  const y = f => VH - Math.min(f, YM) / YM * VH;
  for (const st of steps) {
    const w = st.dur / total * VW, avg = (st.a + st.b) / 2, col = 'var(' + zoneVar(avg) + ')';
    if (st.kind === 'ramp') out += `<polygon points="${x},${VH} ${x},${y(st.a)} ${x + w},${y(st.b)} ${x + w},${VH}" fill="${col}" opacity=".6"/>`;
    else if (st.kind === 'free') out += `<rect x="${x}" y="${y(1)}" width="${w}" height="${VH - y(1)}" fill="none" stroke="var(--muted)" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
    else out += `<rect x="${x}" y="${y(avg)}" width="${Math.max(w - .6, .6)}" height="${VH - y(avg)}" fill="${col}"/>`;
    x += w;
  }
  out += `<line x1="0" x2="${VW}" y1="${y(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".55" vector-effect="non-scaling-stroke"/>`;
  return `<svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="none" role="img" aria-label="Profil des Workouts, gestrichelt die FTP">${out}</svg>`;
}

/* ---------- ZIP schreiben ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  const n = new Date();

  const dd = ((n.getFullYear() - 1980) << 9) | ((n.getMonth() + 1) << 5) | n.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true);
    lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((s, a) => s + a.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);

}
async function saveZip(filename, names) {
  if (!DL) { toast('Download ist in dieser Ansicht nicht verfügbar.'); return; }
  const enc = new TextEncoder();
  const blob = makeZip(names.map(n => ({ name: n, data: enc.encode(woXml(n)) })));
  try { await DL.save({ filename, data: blob }); toast('Gespeichert: ' + filename); }
  catch (e) {
    if (e && e.code === 'declined') return;
    toast('Download fehlgeschlagen' + (e && e.code ? ' (' + e.code + ')' : '') + '.');
  }
}

/* ---------- ZIP lesen (für Garmin-Exporte) ---------- */
async function readZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; } }
  if (e < 0) throw new Error('ZIP-Datei nicht lesbar');
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const out = [], dec = new TextDecoder();
  for (let i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + el + cl;
    if (!/\.(fit|tcx|gpx)$/i.test(name)) continue;
    const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    const raw = u8.slice(ds, ds + csize);
    let data;
    if (method === 0) data = raw;
    else if (method === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('Dieser Browser kann ZIP-Dateien nicht entpacken. Bitte die FIT-Datei direkt hochladen.');
      data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } else continue;
    out.push({ name, data });
  }
  return out;
}

/* ---------- FIT lesen ---------- */
const FIT_EPOCH = 631065600;
const FIT_SZ = {0:1,1:1,2:1,3:2,4:2,5:4,6:4,7:1,8:4,9:8,10:1,11:2,12:4,13:1,14:8,15:8,16:8};
function fitVal(dv, pos, f, le) {
  const t = f.type;
  if (t === 7 || f.size < (FIT_SZ[t] || 1)) return null;

/* --- Diagramme --- */
function weeklyChart() {
  const n = W.length, order = ['rad','schwimmen','kraft','lauf','sonst'];
  const hrs = W.map(() => ({ rad:0, schwimmen:0, kraft:0, lauf:0, sonst:0 }));
  Store.acts.forEach(a => { const i = actWeek(a); if (i >= 0 && i < n) hrs[i][a.sport] += (a.dur || 0) / 3600; });
  const tot = hrs.map(h => order.reduce((s, k) => s + h[k], 0));
  const mx = Math.max.apply(null, tot.concat([3]));
  const step = mx > 12 ? 4 : mx > 6 ? 2 : 1, ymax = Math.ceil(mx / step) * step;
  const VW = 720, VH = 210, ml = 30, mr = 6, mt = 8, mb = 24, pw = VW - ml - mr, ph = VH - mt - mb, col = pw / n;
  const Y = v => mt + ph * (1 - v / ymax);
  let s = '';
  for (let t = 0; t <= ymax; t += step) s += `<line class="grid" x1="${ml}" x2="${VW - mr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${ml - 5}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`;
  for (let i = 0; i < n; i++) {
    const x0 = ml + i * col;
    if (i === sel) s += `<rect x="${x0}" y="${mt}" width="${col}" height="${ph}" fill="var(--accent-soft)"/>`;
    let acc = 0;
    order.forEach(k => {
      const v = hrs[i][k]; if (!v) return;
      s += `<rect x="${x0 + col * .19}" y="${Y(acc + v)}" width="${col * .62}" height="${Math.max(ph * v / ymax, .5)}" fill="var(--s-${k})"/>`;
      acc += v;
    });
    s += `<text class="ax${i === curWeek ? ' b' : ''}" x="${x0 + col / 2}" y="${VH - 8}" text-anchor="middle">${i + 1}</text>`;
    s += `<rect data-week="${i}" x="${x0}" y="${mt}" width="${col}" height="${ph + mb - 4}" fill="transparent" style="cursor:pointer"><title>Woche ${i + 1}: ${num(tot[i], 1)} h</title></rect>`;
  }
  s += `<text class="ax" x="${ml}" y="${mt - 0}" dy="-1" style="display:none"></text>`;
  return `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Trainingszeit pro Woche in Stunden">${s}</svg>`;
}
function niceStep(range, maxTicks) { const c = [1,2,5,10,15,20,30,60,120]; return c.find(v => range / v <= maxTicks) || 120; }
function detailChart(a) {
  const ser = a.series;
  if (!ser || (!ser.p && !ser.hr)) return '<div class="empty">In dieser Datei gibt es keinen Leistungs- oder Herzfrequenzverlauf.</div>';
  const n = (ser.p || ser.hr).length, durMin = a.dur / 60, VW = 720, ml = 42, mr = 8;
  const pw = VW - ml - mr, X = i => ml + pw * ((i + .5) * ser.step / 60) / durMin;
  const panels = [];
  if (ser.p) panels.push({ key:'p', unit:'W', color:'var(--accent)', arr:ser.p });
  if (ser.hr) panels.push({ key:'hr', unit:'bpm', color:'var(--z5)', arr:ser.hr });
  const PH = panels.length === 2 ? [150, 90] : [190];
  let y0 = 22, s = '';
  panels.forEach((pn, k) => {
    const vals = pn.arr.filter(v => v != null);
    let lo = 0, hi;
    if (pn.key === 'p') { hi = Math.ceil(Math.max(Math.max.apply(null, vals), Store.ftp * 1.15) / 50) * 50; }
    else { lo = Math.floor((Math.min.apply(null, vals) - 8) / 10) * 10; hi = Math.ceil((Math.max.apply(null, vals) + 5) / 10) * 10; }
    const h = PH[k], Y = v => y0 + h * (1 - (v - lo) / (hi - lo));
    const st = pn.key === 'p' ? (hi > 300 ? 100 : 50) : (hi - lo > 80 ? 20 : 10);
    for (let t = lo; t <= hi; t += st) s += `<line class="grid" x1="${ml}" x2="${VW - mr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${ml - 5}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`;
    s += `<text class="ax" x="${ml}" y="${y0 - 6}" text-anchor="start">${pn.unit}</text>`;
    let d = '', area = '', open = false, first = 0, lastX = 0;
    pn.arr.forEach((v, i) => {
      if (v == null) { if (open && pn.key === 'p') area += `L${lastX},${Y(lo)}Z`; open = false; return; }
      const x = X(i), y = Y(v);
      if (!open) { d += `M${x},${y}`; area += `M${x},${Y(lo)}L${x},${y}`; open = true; first = x; } else { d += `L${x},${y}`; area += `L${x},${y}`; }
      lastX = x;

    if (open && pn.key === 'p') area += `L${lastX},${Y(lo)}Z`;
    if (pn.key === 'p') {
      s += `<path d="${area}" fill="${pn.color}" opacity=".16"/>`;
      s += `<line x1="${ml}" x2="${VW - mr}" y1="${Y(Store.ftp)}" y2="${Y(Store.ftp)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text class="ax" x="${VW - mr}" y="${Y(Store.ftp) - 4}" text-anchor="end">FTP ${Store.ftp} W</text>`;
    }

  });
  const bottom = y0 - 26;
  const st = niceStep(durMin, 8);

  s += `<text class="ax" x="${VW - mr}" y="${bottom + 16}" text-anchor="end" style="display:none"></text>`;
  s += `<line id="xh" x1="0" x2="0" y1="22" y2="${bottom}" stroke="var(--ink)" opacity=".5" style="display:none"/>`;
  s += `<rect id="xhr" x="${ml}" y="0" width="${pw}" height="${bottom + 4}" fill="transparent"/>`;
  return `<div class="readout" id="readout">Fahre mit der Maus über das Diagramm (Zeit in Minuten).</div><div class="chartwrap"><svg id="dsvg" viewBox="0 0 ${VW} ${bottom + 24}" role="img" aria-label="Verlauf von Leistung und Herzfrequenz">${s}</svg></div>`;
}
function bindDetail(a) {
  const svg = $('#dsvg'); if (!svg || !a.series) return;
  const ser = a.series, n = (ser.p || ser.hr).length, ml = 42, mr = 8, VW = 720, pw = VW - ml - mr;

// Belastung (TSS): mit Leistungsmesser exakt, sonst aus der Herzfrequenz oder pauschal pro Stunde geschätzt
const EST_TSS_H = { rad: 60, schwimmen: 45, kraft: 35, lauf: 65, sonst: 40 };
const PLAN_TSS = { spin: 65, swim: 40, kraft: 35, race: 190 };
const wiCache = {};
const wInfo = f => wiCache[f] || (wiCache[f] = workoutInfo(f));
function plannedTss(s) {
  if (s.tss) return s.tss;   // Trainingslager: Schätzung aus build_dash.py
  if (s.file) return wInfo(s.file).tss;
  if (s.type === 'B') return 150;   // Ausfahrt draußen, ca. 2,5 h
  return PLAN_TSS[s.type] || 0;
}
function hrMaxSeen() { let m = 0; Store.acts.forEach(a => { if (a.maxHr > m) m = a.maxHr; }); return m >= 150 ? m : 0; }
function loadOf(a, hrMax) {
  const t = tssOf(a);
  if (t != null) return { tss: t, est: false };
  const h = (a.dur || 0) / 3600;
  if (a.avgHr && hrMax) { const f = Math.min(a.avgHr / (hrMax * .89), 1.15); return { tss: h * f * f * 100, est: true }; }

  if (w.sessions[6] && w.sessions[6].type === 'camp') chips.push('Kraft 2 entfällt: Sonntag ist Anreise ins Trainingslager');
  if (w.kind === 'deload') chips.push('Entlastungswoche: gleiche Gewichte, nur 2 Sätze');
  if (w.phase === 4) chips.push('Phase 4: kurz halten, Kraft 2 ist optional');
  const dayOf = ps => typeof ps.day === 'number' ? ps.day : (ps.id === 's1' ? 2 : 6);
  const tabs = [];
  const cards = Store.splan.sessions.slice().sort((a, b) => dayOf(a) - dayOf(b)).map(ps => {
    const base = typeof ps.day === 'number' ? ps.day : (ps.id === 's1' ? 2 : 6);
    const orig = ps.id === 's1' ? 2 : ps.id === 's2' ? 6 : ps.id === 's3' ? 5 : base;
    const dayIdx = w.sessions[orig] && canMove(w.sessions[orig]) ? dayOfSess(w, orig) : base;
    const date = addDays(w.startD, dayIdx), key = logKey(w.n, ps.id), lg = Store.slogs[key] || {}, done = !!lg.done;
    const doneEx = ps.exercises.filter(x => lg.ex && lg.ex[x.id] && lg.ex[x.id].d).length;
    let body = '';
    if (editS) {
      const nEx = ps.exercises.length;
      body = `<div class="erow h"><span></span><span>Übung</span><span>Sätze</span><span>Wdh.</span><span></span></div>` + ps.exercises.map((ex, k) =>
        `<div class="erow"><span class="ord"><button class="x-btn" data-sord="-1" data-sess="${esc(ps.id)}" data-ex="${esc(ex.id)}" aria-label="${esc(ex.name || 'Übung')} nach oben"${k === 0 ? ' disabled' : ''}>↑</button><button class="x-btn" data-sord="1" data-sess="${esc(ps.id)}" data-ex="${esc(ex.id)}" aria-label="${esc(ex.name || 'Übung')} nach unten"${k === nEx - 1 ? ' disabled' : ''}>↓</button></span><input class="fld" data-edit="name" data-sess="${esc(ps.id)}" data-ex="${esc(ex.id)}" data-focus="${esc(ex.id)}" value="${esc(ex.name)}" placeholder="Übung" aria-label="Name der Übung">
          <input class="fld" type="number" min="1" max="8" data-edit="sets" data-sess="${esc(ps.id)}" data-ex="${esc(ex.id)}" value="${ex.sets || 3}" aria-label="Sätze">
          <input class="fld" data-edit="reps" data-sess="${esc(ps.id)}" data-ex="${esc(ex.id)}" value="${esc(ex.reps || '')}" placeholder="z. B. 8–10" aria-label="Wiederholungen">
          <button class="x-btn" data-sdel="1" data-sess="${esc(ps.id)}" data-ex="${esc(ex.id)}" aria-label="Übung entfernen">✕</button></div>`).join('')
        + `<div style="margin-top:10px"><button class="btn ghost sm" data-action="s-add" data-sess="${esc(ps.id)}">+ Übung</button></div>`;
    } else if (!ps.exercises.length) {
      body = `<div class="empty">Noch keine Übungen. Tippe oben auf „Plan bearbeiten“.</div>`;
    } else {
      body = ps.exercises.map(ex => {
        const le = (lg.ex && lg.ex[ex.id]) || {}, cur = le.w || [], curR = le.r || [], last = lastFor(ex, w.n), n = ex.sets || 3, exd = !!le.d;
        const unit = unitOf(ps), withReps = /kg|lb/i.test(unit);   // bei Gewichten auch die geschafften Wiederholungen
        const planR = (String(ex.reps || '').match(/\d+/) || [''])[0];
        const inp = (k, kind) => `<input class="fld" type="text" inputmode="${kind === 'r' ? 'numeric' : 'decimal'}" autocomplete="off" aria-label="${esc(ex.name)}, Satz ${k + 1}, ${kind === 'r' ? 'Wiederholungen' : esc(unit || 'Wert')}" data-w="${key}" data-kind="${kind}" data-sid="${esc(ps.id)}" data-ex="${esc(ex.id)}" data-set="${k}" value="${esc((kind === 'r' ? curR : cur)[k] || '')}" placeholder="${esc(kind === 'r' ? (last && last.r[k]) || planR : (last && last.w[k]) || '')}">`;
        const ks = Array.from({ length: n }, (_, k) => k);
        const inputs = withReps
          ? `<div class="sets2" style="--n:${n}"><span></span>${ks.map(k => `<span class="sh">Satz ${k + 1}</span>`).join('')}<span class="sl">${esc(unit)}</span>${ks.map(k => inp(k, 'w')).join('')}<span class="sl">Wdh.</span>${ks.map(k => inp(k, 'r')).join('')}</div>`
          : `<div class="sets">${ks.map(k => inp(k, 'w')).join('')}${unit ? `<span class="u">${esc(unit)}</span>` : ''}</div>`;
        const hint = last ? `${last.week === w.n - 1 ? 'Letzte Woche' : 'Zuletzt (Woche ' + last.week + ')'}: ${esc(fmtSets(last.w, last.r, unit))}` : 'Noch keine Werte aus früheren Wochen.';
        return `<div class="ex${exd ? ' done' : ''}"><div class="ex-h"><label class="exchk"><input type="checkbox" data-exd="${key}" data-sid="${esc(ps.id)}" data-ex="${esc(ex.id)}" data-wn="${w.n}"${exd ? ' checked' : ''} aria-label="${esc(ex.name)} erledigt"><b>${esc(ex.name || 'Ohne Namen')}</b></label><span class="muted tab">${n}×${esc(ex.reps || '')}</span></div>
          ${inputs}<div class="hint">${hint}</div></div>`;
      }).join('');
    }
    const head2 = editS
      ? `<div class="s-h"><input class="fld" style="max-width:240px;font-weight:600" data-edit="sname" data-sess="${esc(ps.id)}" value="${esc(ps.name)}" aria-label="Name der Einheit"><input class="fld" style="max-width:110px" data-edit="unit" data-sess="${esc(ps.id)}" value="${esc(unitOf(ps))}" placeholder="Einheit" aria-label="Einheit der Werte, z. B. kg oder s"></div>`
      : `<div class="s-h"><div><h3>${esc(ps.name)}</h3><span class="muted">${DOW[dayIdx]} ${fmtDM(date)}${ps.exercises.length ? ' · ' + doneEx + ' von ' + ps.exercises.length + ' Übungen' : ''}</span></div>
          <button class="btn sm${done ? ' okb' : ' ghost'}" data-sdone="${key}" data-wn="${w.n}" data-sid="${esc(ps.id)}" aria-pressed="${done}">${done ? 'Erledigt ✓' : 'Abhaken'}</button></div>`;
    tabs.push({ id: ps.id, label: (ps.name || 'Einheit').split(' · ')[0], day: dayIdx, date, done });
    return `<div class="card${done && !editS ? ' sdone' : ''}" data-scard="${esc(ps.id)}">${head2}${body}</div>`;
  }).join('');
  // Handy: nur eine Einheit zeigen. Ohne Wahl die nächste offene dieser Woche, sonst die erste.
  const pick = tabs.find(t => t.id === sTab) || tabs.find(t => !t.done && daysBetween(TODAY, t.date) >= 0) || tabs[0];
  const cur = pick ? pick.id : null;
  const stabs = tabs.length > 1 ? `<div class="stabs" role="group" aria-label="Einheit wählen">${tabs.map(t =>
    `<button data-stab="${esc(t.id)}" aria-pressed="${t.id === cur}"${t.done ? ' class="ok"' : ''}>${esc(t.label)}<small>${DOW[t.day]}${t.done ? ' ✓' : ''}</small></button>`).join('')}</div>` : '';
  const cardsSel = tabs.length > 1 ? cards.replace(/<div class="card( sdone)?" data-scard="([^"]*)">/g, (m, dn, id) => id === esc(cur) ? m : `<div class="card${dn || ''} s-off" data-scard="${id}">`) : cards;
  const sample = Store.splan.sample ? `<div class="banner">Das ist ein Beispielplan. Ändere ihn unter „Plan bearbeiten“ oder schick mir deinen Plan im Chat, dann trage ich ihn ein.</div>` : '';
  const btn = `<button class="btn ghost" data-action="s-edit">${editS ? 'Fertig' : 'Plan bearbeiten'}</button>`;
  el.innerHTML = head(btn)
    + (chips.length ? `<div class="pills" style="margin:0">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : '')
    + sample + (planSession('s3') ? '' : `<div class="banner">Neu: ein kurzer Stabi-Block nach der Rolle B am Samstag. <button class="btn sm" data-action="stabi-create">Stabi-Block anlegen</button></div>`)
    + stabs + `<div class="s-grid">${cardsSel}</div>`;
  const mb = $('#mbar'); if (stabs && mb && mb.offsetHeight) document.documentElement.style.setProperty('--mbar-h', mb.offsetHeight + 'px');  // Auswahl klebt unter der Wochenwahl
  if (focusNew) { const t = el.querySelector('[data-focus="' + focusNew + '"]'); if (t) t.focus(); focusNew = null; }
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', ev => {
  const vt = ev.target.closest('#tabbar [data-view]');
  if (vt) { setView(vt.dataset.view); return; }
  const wkEl = ev.target.closest('[data-week]');
  if (wkEl) {
    sel = Number(wkEl.dataset.week);
    if (isPhone() && wkEl.closest('#strip')) { view = 'woche'; try { localStorage.setItem('ef27.view', view); } catch (e) {} window.scrollTo(0, 0); }
    render(); return;
  }
  const stb = ev.target.closest('[data-stab]');
  if (stb) {
    sTab = stb.dataset.stab;
    try { localStorage.setItem('ef27.stab', sTab); } catch (e) {}
    renderStrength();
    const b = $('#strength [data-stab="' + sTab + '"]'); if (b) b.focus();
    return;
  }
  const act = ev.target.closest('[data-action]');
  if (act) {
    const a = act.dataset.action;
    if (a === 'prev' && sel > 0) { sel--; render(); }
    else if (a === 'next' && sel < W.length - 1) { sel++; render(); }
    else if (a === 'today') { sel = curWeek; render(); }
    else if (a === 'zip-week') {
      const w = W[sel], names = sessionsOf(w).filter(s => s.file).map(s => s.file);
      saveZip('MyWhoosh_' + (w.kind === 'taper' ? 'Taper' : 'W' + pad(w.n)) + '.zip', names);
    }
    else if (a === 'zip-one') { const f = act.dataset.file; saveZip(f.replace(/\.zwo$/, '') + '.zip', [f]); }
    else if (a === 'g-sync') garminSync();
    else if (a === 'push-test') pushTest();
    else if (a === 'push-one') pushWorkouts(W[sel], [Number(act.dataset.i)]);
    else if (a === 'push-week') { const w = W[sel]; pushWorkouts(w, sessionsOf(w).map((s, i) => i).filter(i => sessOf(w, i).file && !pushSig(w, i).past && pushState(w, i) !== 'sent')); }
    else if (a === 'logout') window.ef27Logout();
    else if (a === 'ftp-take') { const v = Number(act.dataset.v); if (v >= 80 && v <= 500) storeFtp(v).then(() => { render(); toast('FTP auf ' + v + ' W gesetzt. In MyWhoosh auch eintragen.'); }); }
    else if (a === 'zip-all') saveZip('MyWhoosh_Alle_Workouts.zip', Object.keys(DATA.workouts).sort());
    else if (a === 'stabi-create' && Store.splan && !planSession('s3')) {
      Store.splan.sessions.push(STABI_DEFAULT()); persistPlan(); renderStrength(); renderWeek(); renderProgress();
      toast('Stabi-Block angelegt. Unter „Plan bearbeiten“ kannst du ihn anpassen.');
    }
    else if (a === 's-edit') { editS = !editS; renderStrength(); renderWeek(); }
    else if (a === 's-create') {
      Store.splan = { sessions: [{ id: 's1', name: 'Kraft 1', day: 2, exercises: [] }, { id: 's2', name: 'Kraft 2', day: 6, exercises: [] }, STABI_DEFAULT()], sample: false };
      editS = true; persistPlan(); renderStrength(); renderWeek();
    }
    else if (a === 's-add') {
      const ps = planSession(act.dataset.sess);
      if (ps) { const id = newId(); ps.exercises.push({ id, name: '', sets: 3, reps: '' }); focusNew = id; touchPlan(); renderStrength(); }
    }
    return;
  }
  const dd = ev.target.closest('[data-ddone]');
  if (dd) { buzz(); toggleDay(Number(dd.dataset.wn), Number(dd.dataset.ddone)); return; }
  const sd = ev.target.closest('[data-sdone]');
  if (sd) { toggleDone(sd.dataset.sdone, Number(sd.dataset.wn), sd.dataset.sid); return; }
  const so = ev.target.closest('[data-sord]');
  if (so) {
    const ps = planSession(so.dataset.sess), dir = Number(so.dataset.sord);
    const k = ps ? ps.exercises.findIndex(e => e.id === so.dataset.ex) : -1, j = k + dir;
    if (k >= 0 && j >= 0 && j < ps.exercises.length) {
      const ex = ps.exercises;
      [ex[k], ex[j]] = [ex[j], ex[k]];
      touchPlan(); renderStrength();
      // Fokus bleibt auf dem Pfeil der verschobenen Übung, damit man mehrfach tippen kann
      const b = document.querySelector(`[data-sord="${dir}"][data-ex="${so.dataset.ex}"]`) || document.querySelector(`[data-sord="${-dir}"][data-ex="${so.dataset.ex}"]`);
      if (b) b.focus();
    }
    return;
  }
  const sx = ev.target.closest('[data-sdel]');
  if (sx) {
    const ps = planSession(sx.dataset.sess);
    if (ps) { ps.exercises = ps.exercises.filter(e => e.id !== sx.dataset.ex); touchPlan(); renderStrength(); }
    return;
  }
  const row = ev.target.closest('[data-act]');
  if (row) { selAct = row.dataset.act; renderGarmin(); return; }
  const del = ev.target.closest('[data-del]');
  if (del) {
    storeRemove(del.dataset.del).then(() => { if (!Store.db) render(); }).catch(() => toast('Löschen fehlgeschlagen.'));
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'fileIn' && ev.target.files && ev.target.files.length) { const fl = Array.from(ev.target.files); ev.target.value = ''; importFiles(fl); }
  else if (ev.target.dataset && ev.target.dataset.move) { buzz(); moveSession(Number(ev.target.dataset.wn), Number(ev.target.dataset.move), Number(ev.target.value)); }
  else if (ev.target.dataset && ev.target.dataset.exd) { buzz(); toggleExDone(ev.target); }
  else if (ev.target.dataset && ev.target.dataset.w) setWeight(ev.target);
  else if (ev.target.dataset && ev.target.dataset.edit) editField(ev.target);
  else if (ev.target.id === 'ftpIn') {
    const v = Math.round(Number(ev.target.value));
    if (v >= 80 && v <= 500) { storeFtp(v).then(render); } else { ev.target.value = Store.ftp; toast('FTP zwischen 80 und 500 W eingeben.'); }
  }
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (!pendingS) return;
    const a = document.activeElement;
    if (a && a.tagName === 'INPUT' && a.closest && a.closest('#strength')) return;
    pendingS = false; renderStrength();
  }, 0);
});
document.addEventListener('pointermove', progHover);
let rsT = null, lastW = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; renderProgress(); } }, 200); });
document.addEventListener('pointerdown', progHover);
document.addEventListener('dragover', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d) { ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', ev => {
  const d = ev.target.closest && ev.target.closest('#drop');
  if (d) { ev.preventDefault(); d.classList.remove('over'); if (ev.dataTransfer && ev.dataTransfer.files.length) importFiles(Array.from(ev.dataTransfer.files)); }
});

/* ---------- Start ---------- */
render();
initStore();
(async () => {
  try { DL = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { DL = null; }
  if (DL === undefined) DL = null;
  render();
})();
</script>
